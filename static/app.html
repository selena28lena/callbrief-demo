<div class="shell">
  <aside class="side">
    <a class="side-brand" href="/">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><use href="#i-logo"/></svg></span>
      <span class="brand-text">Call<span>Brief</span></span>
    </a>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <button class="user-card" id="userSwitch">
        <img class="avatar" id="userAvatar" alt="" src="/static/img/avatars/ivan.jpg">
        <span style="min-width:0;flex:1">
          <b id="userName">Загрузка…</b>
          <span id="userRole"></span>
        </span>
        <svg class="i i-sm" style="color:var(--muted)"><use href="#i-chev"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <a class="crumb" id="backLink" href="#/calls" hidden><svg class="i"><use href="#i-arrow-l"/></svg>Назад к списку</a>
      <div class="spacer"></div>
      <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Проверка подключения…</span></span>
    </div>
    <div id="view"></div>
  </main>
</div>
